<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#062516" />
<title>Sosyal Halı Saha</title>
<script>
window.addEventListener('error', function(e) {
  setTimeout(function(){
    var app = document.getElementById('app');
    if (app && (app.innerHTML.trim() === '' || app.innerHTML.indexOf('Sosyal') === -1)) {
      app.innerHTML = '<div style="margin:20px;padding:16px;background:#3a0a0a;border:2px solid #ff5050;border-radius:12px;color:#ffb0b0;font-family:monospace;font-size:13px;word-break:break-word">' +
        '<b style="color:#ff8080">⚠️ JavaScript Hatası</b><br><br>' +
        '<b>Mesaj:</b> ' + (e.message || 'bilinmiyor') + '<br>' +
        '<b>Dosya:</b> ' + (e.filename || '?') + '<br>' +
        '<b>Satır:</b> ' + (e.lineno || '?') + ':' + (e.colno || '?') +
        '<br><br><a href="" style="color:#a3ffb0">🔄 Yeniden dene</a>' +
        '</div>';
    }
  }, 300);
});
</script>
<style>
:root{--g:#22c55e;--gd:#15803d;--lime:#a3ffb0;--gold:#f5c542;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overscroll-behavior:none;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 50% -10%,#0f4a2c 0%,#062516 45%,#04160e 100%);
  background-attachment:fixed;color:#e9fff2;min-height:100vh;
  padding:18px 14px 50px;-webkit-tap-highlight-color:transparent;
}
#app{max-width:880px;margin:0 auto;}
.title{font-size:clamp(24px,6.5vw,42px);font-weight:900;text-align:center;letter-spacing:1px;
  background:linear-gradient(90deg,#a3ffb0,#22c55e,#7CFFB2);
  -webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;}
.hero{font-size:clamp(56px,18vw,110px);text-align:center;line-height:1;margin:8px 0 4px;
  filter:drop-shadow(0 0 24px rgba(60,255,150,.5));}
.sub{text-align:center;color:#8fd8ae;font-size:14px;letter-spacing:.5px;margin-bottom:26px;font-weight:600;}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:17px;
  font-weight:800;cursor:pointer;margin-bottom:12px;transition:.15s;font-family:inherit;letter-spacing:.3px;}
.btn:active{transform:scale(.98);}
.btn.primary{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;box-shadow:0 8px 24px rgba(34,197,94,.3);}
.btn.secondary{background:rgba(255,255,255,.08);color:#d9ffe8;border:1px solid rgba(120,255,180,.3);}
.btn.gold{background:linear-gradient(135deg,#f5c542,#b8860b);color:#2a1a00;box-shadow:0 8px 24px rgba(245,197,66,.3);}
.btn.ghost{background:transparent;color:#8fd8ae;border:1px dashed rgba(120,255,180,.3);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(120,255,180,.16);border-radius:16px;padding:16px;margin-bottom:14px;}
.card-head{font-weight:800;font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#bfffd6;}
.center{text-align:center;color:#9fe8bd;font-size:14px;}
label{display:block;font-size:13px;color:#8fd8ae;margin:14px 0 6px;font-weight:700;letter-spacing:.4px;}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(120,255,180,.25);
  background:rgba(0,0,0,.35);color:#eafff2;font-size:16px;font-family:inherit;outline:none;}
input:focus,select:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);}
.code-card{text-align:center;background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(0,0,0,.25));}
.code-label{font-size:12px;letter-spacing:3px;color:#8fd8ae;font-weight:700;}
.code{font-size:clamp(40px,13vw,64px);font-weight:900;letter-spacing:10px;color:#a3ffb0;
  text-shadow:0 0 30px rgba(60,255,150,.6);margin:6px 0;}
.hint{font-size:12px;color:#7ec99c;}
.team-row{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid rgba(120,255,180,.1);}
.team-row:last-child{border-bottom:none;}
.team-info{display:flex;align-items:center;gap:12px;}
.team-badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:14px;background:linear-gradient(135deg,#22c55e,#0d5c33);color:#eafff2;flex-shrink:0;}
.team-badge.bot{background:linear-gradient(135deg,#4a6cff,#1f2f8f);}
.team-name{font-weight:800;font-size:15px;}
.team-sub{font-size:12px;color:#8fd8ae;}
.badge{font-size:12px;background:rgba(34,197,94,.2);padding:3px 10px;border-radius:20px;color:#a3ffb0;}
.bot-tag{font-size:10px;background:rgba(100,150,255,.25);padding:2px 7px;border-radius:10px;color:#aaccff;margin-left:6px;}
.mini-btn{background:rgba(255,80,80,.2);border:1px solid rgba(255,120,120,.35);color:#ffb0b0;
  border-radius:8px;padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.mini-btn:hover{background:rgba(255,80,80,.35);}
.mini-btn.green{background:rgba(34,197,94,.25);border-color:rgba(120,255,180,.45);color:#a3ffb0;}
.screen-head{text-align:center;margin-bottom:16px;}
.sh-title{font-size:clamp(20px,5.5vw,28px);font-weight:900;color:#bfffd6;}
.sh-sub{font-size:13px;color:#8fd8ae;margin-top:4px;}
.pool{max-height:44vh;overflow-y:auto;padding-right:6px;margin-bottom:12px;}
.pool::-webkit-scrollbar{width:6px;}
.pool::-webkit-scrollbar-thumb{background:rgba(120,255,180,.3);border-radius:6px;}
.pool-group{margin-bottom:14px;}
.pool-group h4{font-size:12px;color:#8fd8ae;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px;}
.chip{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;border-radius:10px;
  border:1px solid rgba(120,255,180,.16);background:rgba(255,255,255,.04);color:#dfffe9;font-size:12px;
  font-family:inherit;cursor:pointer;text-align:left;transition:.12s;position:relative;}
.chip:hover{background:rgba(255,255,255,.09);}
.chip.on{background:linear-gradient(135deg,#22c55e,#15803d);border-color:#7cffb2;color:#fff;font-weight:700;}
.chip.disabled{opacity:.35;cursor:not-allowed;}
.chip-top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:6px;}
.chip-price{font-size:11px;opacity:.85;white-space:nowrap;}
.trait-icons{display:flex;gap:4px;font-size:10px;margin-top:2px;opacity:.85;}
.budget-row{display:flex;justify-content:space-between;font-size:13px;color:#9fe8bd;margin-bottom:6px;font-weight:700;}
.bar{height:10px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;margin-bottom:12px;}
.bar>div{height:100%;background:linear-gradient(90deg,#22c55e,#a3ffb0);transition:.25s;}
.bar.warn>div{background:linear-gradient(90deg,#f5c542,#ff9d42);}
.slotline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.slot{font-size:11.5px;padding:5px 9px;border-radius:8px;background:rgba(34,197,94,.16);
  border:1px solid rgba(120,255,180,.25);color:#c9ffdd;}
.slot.bench{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#a9c9b7;}
.slot.empty{opacity:.35;font-style:italic;}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(120,255,180,.08);font-size:13.5px;}
.row:last-child{border-bottom:none;}
.rank{width:22px;color:#8fd8ae;font-weight:800;font-size:12px;}
.rname{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rteam{font-size:11.5px;color:#8fd8ae;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rval{font-weight:900;color:#a3ffb0;min-width:24px;text-align:right;}
.live-card{background:linear-gradient(160deg,rgba(34,197,94,.18),rgba(0,0,0,.35));border-color:rgba(120,255,180,.35);}
.live-clock{text-align:center;font-size:14px;color:#a3ffb0;font-weight:800;letter-spacing:2px;margin-bottom:6px;}
.live-score{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 4px;}
.ls-team{flex:1;font-size:13.5px;font-weight:800;text-align:center;color:#dfffee;line-height:1.2;}
.ls-num{font-size:clamp(30px,9vw,44px);font-weight:900;color:#fff;min-width:36px;text-align:center;
  text-shadow:0 0 20px rgba(60,255,150,.5);}
.ls-sep{font-size:24px;color:#7ec99c;}
.live-bar{height:6px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin:8px 0;}
.live-bar>div{height:100%;background:linear-gradient(90deg,#22c55e,#a3ffb0);transition:.15s;}
.feed{margin-top:12px;max-height:150px;overflow-y:auto;}
.feed-item{font-size:12.5px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.25);
  margin-bottom:5px;animation:pop .3s ease;}
.fmin{color:#a3ffb0;font-weight:900;margin-right:4px;}
@keyframes pop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.fx-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;
  border-bottom:1px solid rgba(120,255,180,.08);font-size:13px;}
.fx-row:last-child{border-bottom:none;}
.vs{color:#7ec99c;font-size:11px;font-weight:800;}
.champ-card{text-align:center;padding:26px 16px;border-radius:18px;
  background:linear-gradient(160deg,rgba(245,197,66,.22),rgba(0,0,0,.3));
  border:1px solid rgba(245,197,66,.45);margin-bottom:16px;}
.crown{font-size:52px;animation:bounce 1.6s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.champ-name{font-size:clamp(22px,6vw,32px);font-weight:900;color:#ffe9a8;margin-top:8px;}
.champ-sub{font-size:13px;color:#e0c97a;margin-top:4px;}
.trophy-wrap{text-align:center;padding:30px 12px;position:relative;overflow:hidden;border-radius:16px;}
.trophy{font-size:clamp(90px,28vw,150px);animation:glow 2s infinite alternate;display:inline-block;}
@keyframes glow{from{filter:drop-shadow(0 0 10px rgba(245,197,66,.5));transform:scale(1);}
  to{filter:drop-shadow(0 0 40px rgba(245,197,66,.95));transform:scale(1.06);}}
.trophy-title{font-size:13px;letter-spacing:4px;color:#f5c542;font-weight:800;margin-top:10px;}
.trophy-name{font-size:clamp(26px,8vw,44px);font-weight:900;color:#fff6d6;margin-top:8px;
  text-shadow:0 0 30px rgba(245,197,66,.6);}
.trophy-sub{font-size:13px;color:#e0c97a;margin-top:6px;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{margin-bottom:0;}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:rgba(200,40,40,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;
  font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.5);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.spinner{text-align:center;font-size:38px;padding:40px 16px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
